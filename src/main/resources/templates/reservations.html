<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회의실 예약 현황</title>
    <style>
      body {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px 48px;
        font-family: sans-serif;
        line-height: 1.6;
        background-color: #f5f5f5;
      }
      h1 { margin-bottom: 4px; }
      p.subtitle { color: #666; margin-top: 0; }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
      th {
        background-color: #2d6a4f;
        color: white;
        padding: 12px 16px;
        text-align: left;
        font-size: 14px;
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background-color: #f9f9f9; }

      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 12px;
        background-color: #d8f3dc;
        color: #1b4332;
      }
    </style>
  </head>
  <body>
    <h1>회의실 예약 현황</h1>
    <p class="subtitle">총 <strong th:text="${reservations.size()}">0</strong>건의 예약</p>

    <table>
      <thead>
        <tr>
          <th>회의 제목</th>
          <th>회의실</th>
          <th>위치</th>
          <th>주최자</th>
          <th>부서</th>
          <th>시작</th>
          <th>종료</th>
          <th>인원</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${reservations}">
          <td><strong th:text="${r.title}"></strong></td>
          <td th:text="${r.room}"></td>
          <td th:text="${r.location}"></td>
          <td th:text="${r.host}"></td>
          <td th:text="${r.department}"></td>
          <td th:text="${#temporals.format(r.startTime, 'MM-dd HH:mm')}"></td>
          <td th:text="${#temporals.format(r.endTime, 'HH:mm')}"></td>
          <td th:text="${r.attendees} + '명'"></td>
          <td><span class="badge" th:text="${r.status}"></span></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
